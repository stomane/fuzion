<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuzion Dock</title>
<meta name="description" content="Fuzion Dock, a seamless game dock for Windows, published by Tzar.">
<style>
  :root { --bg:#f7f7f5; --text:#1c1c1a; --muted:#5f5f58; --accent:#7a5cff; --line:#e2e2dc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#131316; --text:#ececeb; --muted:#a3a3a0; --accent:#a690ff; --line:#2e2e34; }
  }
  body {
    margin:0; background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
    font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card { max-width:520px; }
  h1 { font-size:40px; margin:0 0 8px; letter-spacing:-0.02em; }
  p.tag { color:var(--muted); margin:0 0 28px; }
  ul { list-style:none; padding:0; margin:0; border-top:1px solid var(--line); }
  li { border-bottom:1px solid var(--line); }
  a { display:block; padding:14px 2px; color:var(--accent); text-decoration:none; font-weight:550; }
  a:hover { text-decoration:underline; text-underline-offset:2px; }
  footer { color:var(--muted); font-size:13px; margin-top:28px; }
</style>
</head>
<body>
<div class="card">
  <h1>Fuzion Dock</h1>
  <p class="tag">A seamless game dock for Windows, with automatic icon fetching, deal tracking and gamepad support.</p>
  <ul>
    <li><a href="https://apps.microsoft.com/detail/9MTL580GPQ00" rel="noopener">Get it on the Microsoft Store</a></li>
    <li><a href="https://github.com/stomane/fuzion" rel="noopener">Source code on GitHub</a></li>
    <li><a href="https://discord.gg/KQRrT6JBUv" rel="noopener">Fuzion Discord</a></li>
    <li><a href="privacy.html">Privacy policy</a></li>
  </ul>
  <footer>Published by Tzar.</footer>
</div>
</body>
</html>
